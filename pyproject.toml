[project]
name = "test-creator-mcp"
version = "0.1.0"
description = "MCP server for creating GATE mock tests using Google Forms"
requires-python = ">=3.11"

dependencies = [
    "fastmcp",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "httpx>=0.28.1",
    "pydantic",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "main.py",
    "google_forms.py",
    "schemas.py",
]
